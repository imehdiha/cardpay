openapi: 3.1.0
info:
  title: CardPay API
  version: 1.0.5
  description: Self-hosted card-transfer payment and incoming SMS API.
servers:
  - url: https://pay.example.com/api/v1
paths:
  /payments:
    post:
      summary: Create an idempotent payment
      security: [{CardPayHmac: []}]
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 190}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePayment'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/PaymentResponse'}}}}
        '200': {description: Idempotent replay, content: {application/json: {schema: {$ref: '#/components/schemas/PaymentResponse'}}}}
        '422': {$ref: '#/components/responses/Error'}
  /payments/{payment_id}:
    get:
      summary: Get payment status
      security: [{CardPayHmac: []}]
      parameters: [{$ref: '#/components/parameters/PaymentId'}]
      responses:
        '200': {description: Current payment, content: {application/json: {schema: {$ref: '#/components/schemas/PaymentResponse'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /payments/{payment_id}/verify:
    post:
      summary: Verify payment server-to-server
      security: [{CardPayHmac: []}]
      parameters: [{$ref: '#/components/parameters/PaymentId'}]
      responses:
        '200': {description: Current payment, content: {application/json: {schema: {$ref: '#/components/schemas/PaymentResponse'}}}}
  /payments/{payment_id}/cancel:
    post:
      summary: Cancel a pending payment
      security: [{CardPayHmac: []}]
      parameters: [{$ref: '#/components/parameters/PaymentId'}]
      responses:
        '200': {description: Canceled, content: {application/json: {schema: {$ref: '#/components/schemas/PaymentResponse'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /public/payments/{public_id}/status:
    get:
      summary: Poll the hosted page status
      parameters:
        - {name: public_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Public status, content: {application/json: {schema: {$ref: '#/components/schemas/PublicStatusResponse'}}}}
  /devices/incoming-sms:
    post:
      summary: Receive raw SMS from an authenticated device
      security: [{DeviceHmac: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_id, raw_sms, received_at]
              properties:
                message_id: {type: string, maxLength: 190}
                sender: {type: string}
                raw_sms: {type: string, maxLength: 10000}
                received_at: {type: string, format: date-time}
      responses:
        '201': {description: Stored and processed}
        '200': {description: Idempotent duplicate response}
        '401': {$ref: '#/components/responses/Error'}
  /devices/shortcut-sms:
    post:
      summary: Receive an SMS from Apple Shortcuts without client-side HMAC
      description: Use only over HTTPS outside a trusted local test network. Apple Shortcuts should send device_key and device_secret in the JSON body. X-Device-Key and X-Device-Secret headers remain supported for other clients. Missing message_id and received_at are generated by the server.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_key, device_secret, raw_sms]
              properties:
                device_key: {type: string, maxLength: 190}
                device_secret: {type: string, maxLength: 190}
                raw_sms: {type: string, maxLength: 10000}
                sender: {type: string}
                message_id: {type: string, maxLength: 190}
                received_at: {type: string, format: date-time}
      responses:
        '201': {description: Stored and processed}
        '200': {description: Idempotent duplicate response}
        '401': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    CardPayHmac:
      type: apiKey
      in: header
      name: X-CardPay-Key
      description: Also send X-CardPay-Timestamp, X-CardPay-Nonce and X-CardPay-Signature.
    DeviceHmac:
      type: apiKey
      in: header
      name: X-Device-Key
      description: Also send X-Device-Timestamp, X-Device-Nonce and X-Device-Signature.
    DeviceShortcut:
      type: apiKey
      in: header
      name: X-Device-Secret
      description: Also send X-Device-Key. HTTPS is required in production.
  parameters:
    PaymentId: {name: payment_id, in: path, required: true, schema: {type: string, pattern: '^PAY_'}}
  schemas:
    CreatePayment:
      type: object
      required: [amount]
      properties:
        amount: {type: integer, minimum: 1, example: 80000000}
        bank_card_id: {type: integer, minimum: 1}
        external_order_id: {type: string, maxLength: 190}
        description: {type: string}
        customer:
          type: object
          properties: {name: {type: string}, mobile: {type: string}, reference: {type: string}}
        return_url: {type: string, format: uri, description: Must match the application's allowed domain list when configured.}
        callback_url: {type: string, format: uri, description: Per-payment webhook override; must match the application's allowed domain list when configured.}
        metadata: {type: object, additionalProperties: true}
    Payment:
      type: object
      properties:
        payment_id: {type: string}
        status: {type: string, enum: [pending, paid, expired, canceled, manual_review, rejected]}
        original_amount: {type: integer}
        token: {type: integer}
        payable_amount: {type: integer}
        currency: {type: string, example: IRR}
        payment_url: {type: string, format: uri}
        expires_at: {type: string, format: date-time}
        paid_at: {type: [string, 'null'], format: date-time}
        idempotent_replay: {type: boolean}
    PaymentResponse:
      type: object
      required: [success, data]
      properties: {success: {const: true}, data: {$ref: '#/components/schemas/Payment'}}
    PublicStatusResponse:
      type: object
      properties:
        success: {const: true}
        data:
          type: object
          properties: {payment_id: {type: string}, status: {type: string}, payable_amount: {type: integer}, expires_at: {type: string, format: date-time}, paid_at: {type: [string, 'null'], format: date-time}}
    Error:
      type: object
      properties:
        success: {const: false}
        error:
          type: object
          properties: {code: {type: string}, message: {type: string}, details: {type: object}}
  responses:
    Error:
      description: Standard error
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
